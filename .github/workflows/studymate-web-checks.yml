name: StudyMate web checks
on:
  pull_request:
    paths: ['studymate-web/**', '.github/workflows/studymate-web-*.yml']
  push:
    branches: [main]
    paths: ['studymate-web/**', '.github/workflows/studymate-web-*.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studymate-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: studymate-web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: studymate-web-static
          path: studymate-web/dist
